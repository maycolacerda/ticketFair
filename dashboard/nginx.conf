server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

   
    location / {
        sub_filter 'window.API_BASE || ' 'window.API_BASE || ';
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}